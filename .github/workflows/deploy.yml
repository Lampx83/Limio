name: Deploy (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy production stack
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    # Đường dẫn file .env.prod trên server. Có thể override bằng repo variable cùng tên.
    env:
      ENV_FILE: ${{ vars.ENV_FILE || '/etc/feedbackme/.env.prod' }}
      COMPOSE_FILE: docker-compose.prod.yml
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify prerequisites on runner
        run: |
          set -euo pipefail
          docker version
          docker compose version
          test -f "$ENV_FILE" || { echo "::error::Missing $ENV_FILE on runner"; exit 1; }

      - name: Build images
        run: |
          set -euo pipefail
          # --pull omitted: base images (node:20-alpine, alpine:3.20) are
          # cached on the self-hosted runner and pulling on every commit adds
          # ~10 s for a registry manifest check with no benefit.
          # Run `docker compose pull` manually on the runner when you want to
          # pick up base-image security patches.
          #
          # BUILDKIT_INLINE_CACHE omitted: it embeds cache metadata inside the
          # image for registry-pull scenarios. We build and run locally so it
          # only bloats image size with no speedup.
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build

      - name: Apply database migrations
        run: |
          set -euo pipefail
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" \
            run --rm migrate

      - name: Seed demo users
        run: |
          set -euo pipefail
          # Idempotent: seed-demo-users checks existence before inserting.
          # Reuses the migrator image (same DATABASE_URL env) but overrides CMD.
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" \
            run --rm migrate \
            ./node_modules/.bin/tsx src/seed-demo-users.ts

      - name: Roll out services
        run: |
          set -euo pipefail
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d \
            --remove-orphans \
            --no-build \
            postgres redis web cron

      - name: Wait for web to become healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps -q web)" 2>/dev/null || echo starting)
            echo "[$i] web health: $status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy) docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=200 web; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::web did not become healthy in time"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=200 web
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Compose file: \`$COMPOSE_FILE\`"
            echo "- Env file: \`$ENV_FILE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Ghi release vào DB để admin xem trên /admin/changelog.
      # Đọc NEXTAUTH_URL + CRON_SECRET từ .env.prod — không cần secret riêng trong GitHub.
      # Bước này non-fatal: deploy không bị revert nếu ghi DB thất bại.
      - name: Record release in app DB
        if: success()
        run: |
          set -euo pipefail
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          TAG="deploy-${SHORT}"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Đọc version từ package.json (semver hiển thị trong changelog)
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")

          # Đọc các biến cần thiết từ .env.prod
          APP_URL=$(grep -E '^NEXTAUTH_URL=' "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"' || true)
          CRON_SEC=$(grep -E '^CRON_SECRET=' "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"' || true)

          if [ -z "$APP_URL" ] || [ -z "$CRON_SEC" ]; then
            echo "Warning: NEXTAUTH_URL hoặc CRON_SECRET chưa được cấu hình trong $ENV_FILE — bỏ qua ghi changelog."
            exit 0
          fi

          # Build changelog body từ git log (kể từ tag trước hoặc 20 commit gần nhất)
          LAST_TAG=$(git tag --sort=-creatordate | grep '^deploy-' | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            LOG_RANGE="${LAST_TAG}..HEAD"
          else
            LOG_RANGE="HEAD~20..HEAD"
          fi

          CHANGES=$(git log $LOG_RANGE --pretty=format:"%s" --no-merges | awk '
            /^feat/     { print "- ✨ " $0 }
            /^fix/      { print "- 🐛 " $0 }
            /^perf/     { print "- ⚡ " $0 }
            /^refactor/ { print "- ♻️  " $0 }
            /^style/    { print "- 💄 " $0 }
            /^test/     { print "- 🧪 " $0 }
            /^docs/     { print "- 📚 " $0 }
            /^chore/    { print "- 🔧 " $0 }
            /^ci/       { print "- 🔄 " $0 }
            /^build/    { print "- 🏗️  " $0 }
            /^revert/   { print "- ⏪ " $0 }
            !/^(feat|fix|perf|refactor|style|test|docs|chore|ci|build|revert|Merge)/ { print "- 📦 " $0 }
          ' || echo "- Deploy $SHORT")

          # Ghép version header vào đầu body
          if [ -n "$VERSION" ]; then
            VERSION_HEADER="## v${VERSION}"$'\n\n'"**Commit:** \`${SHORT}\`  **Tag:** \`${TAG}\`"$'\n\n'"---"$'\n\n'
          else
            VERSION_HEADER=""
          fi
          BODY="${VERSION_HEADER}${CHANGES}"
          [ -z "$CHANGES" ] && BODY="${VERSION_HEADER}- Deploy ${SHORT}"

          # Escape body thành JSON string
          BODY_JSON=$(echo "$BODY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          curl -s -f -X POST "${APP_URL}/api/system/releases" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SEC}" \
            -d "{\"tag\":\"${TAG}\",\"sha\":\"${{ github.sha }}\",\"body\":${BODY_JSON},\"deployedAt\":\"${DEPLOYED_AT}\"}" \
            && echo "Release ${TAG} (v${VERSION}) đã ghi vào DB." \
            || echo "Warning: ghi changelog vào DB thất bại (non-fatal)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Tạo GitHub Release với changelog tự động sau mỗi deploy thành công.
  # Chạy trên ubuntu-latest (GitHub-hosted) để luôn có đủ tool (gh, node...).
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    # Chỉ tạo release khi deploy thật sự xảy ra (push to main), không tạo khi
    # workflow_dispatch với ref tuỳ ý (rollback, hot-patch...) để tránh tag nhầm.
    if: ${{ success() && github.event_name == 'push' }}

    permissions:
      contents: write   # Cần để tạo tag + release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần full history để generate changelog

      - name: Generate changelog & create release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha   = context.sha;
            const short = sha.substring(0, 7);
            const tag   = `deploy-${short}`;
            const now   = new Date();

            // ── Đọc semver từ package.json ──────────────────────────────────
            const { execSync } = require('child_process');
            let version = '';
            try {
              version = execSync('node -p "require(\'./package.json\').version"', { encoding: 'utf8' }).trim();
            } catch (_) {}

            // ── Format ngày giờ theo múi giờ Việt Nam (UTC+7) ──────────────
            const vnDate = new Date(now.getTime() + 7 * 60 * 60 * 1000);
            const pad  = n => String(n).padStart(2, '0');
            const dateStr = `${pad(vnDate.getUTCDate())}/${pad(vnDate.getUTCMonth()+1)}/${vnDate.getUTCFullYear()}`;
            const timeStr = `${pad(vnDate.getUTCHours())}:${pad(vnDate.getUTCMinutes())}`;

            // ── Lấy tag trước để biết khoảng commit ────────────────────────
            let previousTag = '';
            try {
              const { data: tags } = await github.rest.repos.listTags({
                owner, repo, per_page: 5,
              });
              const deployTags = tags.filter(t => t.name.startsWith('deploy-'));
              previousTag = deployTags[0]?.name ?? '';
            } catch (_) {}

            // ── Build nội dung release notes từ git log ─────────────────────
            let logRange = previousTag ? `${previousTag}..HEAD` : 'HEAD~20..HEAD';
            let rawLog = '';
            try {
              rawLog = execSync(
                `git log ${logRange} --pretty=format:"%H|%s|%an" --no-merges`,
                { encoding: 'utf8' }
              ).trim();
            } catch (_) {
              rawLog = execSync(
                `git log HEAD~10..HEAD --pretty=format:"%H|%s|%an" --no-merges`,
                { encoding: 'utf8' }
              ).trim();
            }

            // ── Phân loại commit theo conventional commits ──────────────────
            const groups = {
              '✨ Tính năng mới':   [],
              '🐛 Sửa lỗi':        [],
              '⚡ Hiệu năng':       [],
              '♻️  Cải tiến code':  [],
              '💄 Giao diện':       [],
              '🧪 Kiểm thử':        [],
              '📚 Tài liệu':        [],
              '🔧 Bảo trì':         [],
              '🔄 CI/CD':           [],
              '📦 Thay đổi khác':   [],
            };
            const typeMap = {
              feat: '✨ Tính năng mới',
              fix:  '🐛 Sửa lỗi',
              perf: '⚡ Hiệu năng',
              refactor: '♻️  Cải tiến code',
              style: '💄 Giao diện',
              test:  '🧪 Kiểm thử',
              docs:  '📚 Tài liệu',
              chore: '🔧 Bảo trì',
              ci:    '🔄 CI/CD',
              build: '🔧 Bảo trì',
              revert:'🐛 Sửa lỗi',
            };

            if (rawLog) {
              for (const line of rawLog.split('\n')) {
                const [commitSha, subject, author] = line.split('|');
                if (!subject) continue;
                const m = subject.match(/^(\w+)(?:\(([^)]+)\))?\!?:\s*(.+)/);
                let group = '📦 Thay đổi khác';
                let msg   = subject;
                if (m) {
                  group = typeMap[m[1]] ?? '📦 Thay đổi khác';
                  msg   = m[2] ? `**${m[2]}:** ${m[3]}` : m[3];
                }
                const link = `[\`${commitSha.substring(0,7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${commitSha})`;
                groups[group].push(`- ${msg} (${link})`);
              }
            }

            // ── Render markdown ─────────────────────────────────────────────
            const versionBadge = version ? ` · v${version}` : '';
            let body = `## 🚀 Deploy \`${tag}\`${versionBadge} — ${dateStr} lúc ${timeStr} (ICT)\n\n`;
            if (version) body += `**Phiên bản:** \`v${version}\`\n`;
            body += `**Commit:** [\`${short}\`](${context.serverUrl}/${owner}/${repo}/commit/${sha})\n`;
            if (previousTag) {
              body += `**So với:** [\`${previousTag}\`](${context.serverUrl}/${owner}/${repo}/compare/${previousTag}...${tag})\n`;
            }
            body += '\n---\n\n';

            let hasAny = false;
            for (const [title, lines] of Object.entries(groups)) {
              if (lines.length === 0) continue;
              body += `### ${title}\n${lines.join('\n')}\n\n`;
              hasAny = true;
            }
            if (!hasAny) body += '_Không có commit mới.\n';

            body += `\n---\n_Release được tạo tự động bởi deploy workflow._\n`;

            // ── Tạo tag ─────────────────────────────────────────────────────
            try {
              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Tag ${tag} created`);
            } catch (e) {
              if (e.status === 422) {
                core.warning(`Tag ${tag} already exists — skipping`);
              } else {
                throw e;
              }
            }

            // ── Tạo GitHub Release ───────────────────────────────────────────
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name:   tag,
              name:       version ? `🚀 v${version} (${tag}) — ${dateStr}` : `🚀 ${tag} — ${dateStr}`,
              body,
              prerelease: false,
              make_latest: 'true',
            });

            core.info(`Release created: ${release.html_url}`);

            // ── Ghi vào Step Summary ─────────────────────────────────────────
            await core.summary
              .addHeading('📋 Release đã tạo')
              .addTable([
                [{ data: 'Tag',     header: true }, { data: 'Release', header: true }],
                [tag, `[${release.name}](${release.html_url})`],
              ])
              .addRaw(body)
              .write();
