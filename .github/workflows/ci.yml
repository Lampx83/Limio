name: CI

# Runs on every push to main and on PRs. `paths-ignore` keeps doc-only and
# script-only pushes from burning Actions minutes — the quota ran out once
# before, and content-seeding commits don't touch anything CI can check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/web/scripts/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/web/scripts/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg15 = ảnh chính thức của postgres:15 gốc + extension
        # "vector" cài sẵn — cần cho migration OralExamMaterialChunk.embedding
        # (CREATE EXTENSION "vector"), đồng bộ với docker-compose.yml.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: feedbackme
          POSTGRES_PASSWORD: feedbackme
          POSTGRES_DB: feedbackme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedbackme -d feedbackme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # DB name MUST contain "feedbackme_test" — enforced by global-setup.ts guard
      # in core-* packages (chống chạy test lên DB thật, xem CLAUDE.md §4.5).
      DATABASE_URL: postgresql://feedbackme:feedbackme@localhost:5432/feedbackme_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @feedbackme/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (verify Next.js standalone output)
        # Increase heap for "Collecting build traces" — the pnpm virtual
        # store is large enough that the default 2 GB V8 limit is hit.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm --filter @feedbackme/web build

  docker-build:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    # Chỉ chạy trên PR để bắt lỗi Dockerfile trước khi merge. Bỏ qua khi push
    # thẳng vào main: deploy.yml (self-hosted) build lại image THẬT ngay sau
    # đó để roll out — build ở đây thêm lần nữa chỉ tốn thời gian mà không có
    # thông tin mới, và trước đây còn `needs: lint-typecheck-test` khiến 2 job
    # chạy nối đuôi thay vì song song, kéo CI lên ~12 phút cho mỗi push main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          # ignore-error: ghi cache hỏng thì CẢNH BÁO, không đánh trượt build.
          #
          # Việc của job này là trả lời "image có dựng được không". Đã dựng
          # xong rồi mà vẫn trượt vì không ghi nổi cache thì câu trả lời sai —
          # và nó chặn deploy. Đúng chuyện xảy ra với 2221c67: build xanh hết,
          # tới bước cuối báo "failed to reserve cache" (hạn mức cache 10 GB
          # của repo cạn vì mode=max ghi cả tầng node_modules ~200 MB mỗi lần)
          # → CI đỏ → cổng deploy từ chối → production đứng im cả đêm.
          #
          # Cache chỉ để chạy nhanh hơn. Mất cache thì build chậm, không sai.
          cache-to: type=gha,mode=max,ignore-error=true
