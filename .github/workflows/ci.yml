name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: feedbackme
          POSTGRES_PASSWORD: feedbackme
          POSTGRES_DB: feedbackme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedbackme -d feedbackme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # DB name MUST contain "feedbackme_test" — enforced by global-setup.ts guard
      # in core-* packages (chống chạy test lên DB thật, xem CLAUDE.md §4.5).
      DATABASE_URL: postgresql://feedbackme:feedbackme@localhost:5432/feedbackme_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @feedbackme/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (verify Next.js standalone output)
        # Increase heap for "Collecting build traces" — the pnpm virtual
        # store is large enough that the default 2 GB V8 limit is hit.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm --filter @feedbackme/web build

  docker-build:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
