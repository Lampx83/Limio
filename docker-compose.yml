services:
  postgres:
    image: postgres:15
    container_name: feedbackme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbackme
      POSTGRES_PASSWORD: feedbackme
      POSTGRES_DB: feedbackme
    ports:
      - "5433:5432"
    volumes:
      - feedbackme-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackme -d feedbackme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feedbackme-pg:
