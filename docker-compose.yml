# KHÔNG đặt `container_name:` cố định cho postgres/redis (xem sự cố
# 2026-09-13: container_name trùng giữa checkout gốc và mỗi `git worktree`
# — worktree nào `docker compose up` sau cùng sẽ giành mất tên container,
# volume rẽ nhánh âm thầm, dữ liệu "lùi thời gian" không báo lỗi gì).
# Để mặc định, Compose tự đặt tên theo COMPOSE_PROJECT_NAME (= tên thư mục
# checkout, khác nhau giữa main repo và mỗi worktree) — nên nếu 2 checkout
# cùng cố `docker compose up`, cổng 5434/6379 sẽ báo lỗi "already allocated"
# NGAY LẬP TỨC thay vì âm thầm phân nhánh dữ liệu. Đây là tín hiệu ĐÚNG:
# chỉ 1 checkout (thường là repo gốc) được chạy Postgres/Redis dev; mọi
# worktree/phiên khác dùng lại instance đang chạy qua localhost:5434/6379,
# không tự `docker compose up`/`pnpm db:up` riêng. Xem CLAUDE.md §6.
services:
  postgres:
    # A6.2 — pgvector = postgres:15 + extension "vector" cài sẵn. Ghim cùng tag
    # với docker-compose.prod.yml: đổi codename OS (bookworm/trixie) làm lệch
    # collation glibc, phải REINDEX (docs/van-hanh/collation-postgres-2026-10.md).
    image: pgvector/pgvector:0.8.7-pg15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbackme
      POSTGRES_PASSWORD: feedbackme
      POSTGRES_DB: feedbackme
    ports:
      - "5434:5432"
    volumes:
      - feedbackme-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackme -d feedbackme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - feedbackme-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  feedbackme-pg:
  feedbackme-redis:
