# Production stack for FeedBackMe — chạy hoàn toàn bằng Docker.
# Build & run: docker compose -f docker-compose.prod.yml up -d --build
# Migrate    : docker compose -f docker-compose.prod.yml run --rm migrate
#
# Required env (.env.prod or shell):
#   POSTGRES_PASSWORD, NEXTAUTH_SECRET (or AUTH_SECRET), NEXTAUTH_URL, CRON_SECRET
# Optional:
#   IMAGE_TAG (default "latest"), WEB_PORT (default 8004),
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY, SENTRY_DSN, ...

name: feedbackme

x-web-env: &web-env
  NODE_ENV: production
  # Web đi qua PgBouncer (transaction mode) — pgbouncer=true tắt prepared statement của Prisma.
  # Interactive $transaction(async) vẫn chạy được nhưng không có prepared statement cache (chấp nhận: chỉ 5 call site lạnh).
  DATABASE_URL: postgresql://feedbackme:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@pgbouncer:6432/feedbackme?schema=public&pgbouncer=true&connection_limit=1&pool_timeout=30
  REDIS_URL: redis://redis:6379
  NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL required}
  # NextAuth v5 reads AUTH_SECRET (not NEXTAUTH_SECRET) in production.
  # We derive it from NEXTAUTH_SECRET so existing .env.prod files need no change.
  AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  # Allow NextAuth to accept plain-HTTP and proxied requests (IP:PORT, etc.).
  AUTH_TRUST_HOST: "1"
  CRON_SECRET: ${CRON_SECRET:?CRON_SECRET required}
  # 32-byte key (hex 64 chars) dùng để mã hoá IntegrationCredential (OpenAI key, v.v.).
  # Sinh bằng: openssl rand -hex 32. KHÔNG ĐỔI sau khi đã lưu credential.
  SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?SECRETS_MASTER_KEY required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbackme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: feedbackme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackme -d feedbackme"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Connection pooler đứng giữa web và postgres.
  # Transaction mode: 1 server connection được pin cho mỗi transaction (đủ cho Prisma).
  # KHÔNG dùng cho migrate (DDL cần session mode) — migrate connect thẳng postgres:5432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    environment:
      DB_USER: feedbackme
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: feedbackme
      # PgBouncer listen port. Image mặc định = 5432, nhưng web DATABASE_URL của
      # ta đang gọi pgbouncer:6432 — set rõ để khớp và tránh nhầm với postgres.
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      # Prisma gửi prepared statement; PgBouncer transaction mode không hỗ trợ → cần ignore.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # edoburu/pgbouncer (Alpine) không có pg_isready (tool của Postgres, không có
      # trong image pgbouncer). Dùng /dev/tcp của bash để kiểm port 6432 còn LISTEN
      # — đây là cách duy nhất chạy được mà không cài thêm gì.
      # Image có /bin/sh là dash/ash → không hỗ trợ /dev/tcp. Dùng busybox nc thay.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: feedbackme/migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://feedbackme:${POSTGRES_PASSWORD}@postgres:5432/feedbackme?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Empty basePath for root domain serving (e.g., fit.neu.edu.vn/)
        # Set to "/limio" only if serving at sub-path (e.g., domain.com/limio/)
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH}"
    image: feedbackme/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *web-env
    ports:
      - "${WEB_PORT:-8004}:3000"
    volumes:
      - web-uploads:/app/apps/web/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: feedbackme/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *web-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    build:
      context: ./docker/cron
    image: feedbackme/cron:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      WEB_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  web-uploads:
