# Production stack for FeedBackMe — chạy hoàn toàn bằng Docker.
# Build & run: docker compose -f docker-compose.prod.yml up -d --build
# Migrate    : docker compose -f docker-compose.prod.yml run --rm migrate
#
# Required env (.env.prod or shell):
#   POSTGRES_PASSWORD, NEXTAUTH_SECRET (or AUTH_SECRET), NEXTAUTH_URL, CRON_SECRET
# Optional:
#   IMAGE_TAG (default "latest"), WEB_PORT (default 8004),
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY, SENTRY_DSN, ...

name: feedbackme

x-web-env: &web-env
  NODE_ENV: production
  DATABASE_URL: postgresql://feedbackme:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/feedbackme?schema=public
  REDIS_URL: redis://redis:6379
  NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL required}
  # NextAuth v5 reads AUTH_SECRET (not NEXTAUTH_SECRET) in production.
  # We derive it from NEXTAUTH_SECRET so existing .env.prod files need no change.
  AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  CRON_SECRET: ${CRON_SECRET:?CRON_SECRET required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbackme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: feedbackme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackme -d feedbackme"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: feedbackme/migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://feedbackme:${POSTGRES_PASSWORD}@postgres:5432/feedbackme?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: feedbackme/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *web-env
    ports:
      - "${WEB_PORT:-8004}:3000"
    volumes:
      - web-uploads:/app/apps/web/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    build:
      context: ./docker/cron
    image: feedbackme/cron:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      WEB_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  web-uploads:
